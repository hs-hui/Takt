[versions]
agp = "8.13.2"
kotlin = "2.2.21"
coreKtx = "1.16.0"
activityCompose = "1.10.1"
composeBom = "2025.12.01"
wearCompose = "1.5.6"
lifecycle = "2.9.4"
datastore = "1.1.7"
wearOngoing = "1.1.0"
junit = "4.13.2"
tiles = "1.5.0"
protolayout = "1.3.0"
